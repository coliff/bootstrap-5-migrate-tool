name: Release notes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      # allow release-drafter/release-drafter to create GitHub releases and read merged PRs
      contents: write
      pull-requests: read
    runs-on: ubuntu-slim
    if: github.repository == 'coliff/bootstrap-5-migrate-tool'

    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
